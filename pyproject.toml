[project]
name = "tradesense"
version = "0.1.0"
description = "Options volatility-premium trading agent — Alpaca AI Trading Agents Hackathon"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.9",
]

[tool.uv]
package = false

# Runtime dependency policy: pydantic, and nothing else without a reason written here.
#
# src/ was standard-library-only until 2026-08-26. That guarantee bought a clone-and-run repo; it
# cost validation at the one place it matters, which is where Alpaca JSON crosses into this code.
# An absent `greeks` key on an otherwise-200 response is this project's most-repeated failure, and
# a dict silently returning None for it is exactly how that failure stays quiet. Pydantic makes the
# boundary raise instead.
#
# No database driver, still. That rule is unchanged and is about what teammates can run.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

# Measurement scripts named by a committed registration are excluded from formatting.
# A registration names a file and a commit as the definition of how a result was produced.
# Reformatting one leaves the working copy differing from the file the registration describes, and
# anyone checking reproducibility then has to decide for themselves whether the differences are
# cosmetic. Keeping them byte-identical costs nothing and removes that question entirely.
#
# The list is every script named in docs/measurement-log.md or a registration under docs/. Add to
# it whenever a new registration names a script; a formatter run is otherwise free to rewrite the
# evidence. This was not hypothetical -- `ruff format` reflowed extended_ic.py twice on 31 Aug.
extend-exclude = [
    "scripts/block_permutation.py",
    "scripts/cost_breakeven.py",
    "scripts/extended_ic.py",
    "scripts/iv_series_probe.py",
    "scripts/review_remediation.py",
    "scripts/roll_regime.py",
    "scripts/roll_spread.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes — unused imports, undefined names
    "I",    # import sorting
    "UP",   # pyupgrade — modern syntax
    "B",    # bugbear — likely bugs, mutable defaults, unused loop vars
]
ignore = [
    "E741",  # ambiguous variable name: `l` reads fine in short numeric loops here
]

[tool.ruff.lint.per-file-ignores]
# Scripts add the repo root to sys.path before importing from src/, so their imports cannot sit at
# the top of the file. This is a deliberate structure, not an oversight.
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
]
